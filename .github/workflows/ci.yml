name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Show repository structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort
          
      - name: Diagnose Python import
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== app directory ====="
          ls -la app

          echo "===== Python version ====="
          python --version

          echo "===== Python sys.path ====="
          python -c "import sys; print('\n'.join(sys.path))"

          echo "===== Test direct import ====="
          python -c "import app; print(app); print(app.__file__)"

          echo "===== Test application import ====="
          python -c "from app.app import calculate_total; print(calculate_total(100, 10))"

      - name: Run tests
        run: pytest -v
